{% extends "base.html" %}
{% block title %}Выход · VK SMM{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px">
  <h1 class="h4 mb-3">Выйти из кабинета?</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-accent">Выйти</button>
    <a class="btn btn-outline-dark" href="{{ url_for('smm.manager_panel') }}">Остаться</a>
  </form>
</div>
{% endblock %}
